[tool.poetry]
name = "lyricsgenerator"
version = "0.1.0"
description = "Lyrics Generator App"
authors = ["enchanted-potato <kr.karakatsani@gmail.com>"]
readme = "README.md"
packages = [{include = "lyricsgenerator"}]

[tool.poetry.dependencies]
python = "^3.11"
keras = "^3.3.3"
pandas = "^2.2.2"
tensorflow = "^2.16.1"
flask = "^3.0.3"
lyricsgenius = "^3.7.5"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
pytest = "^7.3.1"
isort = "^5.12.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
